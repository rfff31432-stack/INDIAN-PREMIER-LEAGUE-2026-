       <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Match Schedule</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #060318;
            background-image: 
                radial-gradient(at 10% 10%, rgba(90, 56, 253, 0.25) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(234, 26, 133, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 10px 0;
        }

        /* Modern Glass Card */
        .match-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .match-card:hover {
            transform: translateY(-4px);
            border-color: rgba(90, 56, 253, 0.5);
        }

        .card-top {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
        }

        .date-badge {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .time-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        /* Banner Style */
        .card-banner {
            padding: 24px 20px;
            text-align: center;
            position: relative;
        }

        .match-number {
            background: rgba(90, 56, 253, 0.2);
            color: #c7d2fe;
            border: 1px solid rgba(90, 56, 253, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .teams-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 38%;
        }

        /* Glowing Team Badges */
        .flag {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 15px;
            color: #fff;
            margin-bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* Vibrant Colors */
        .flag-MI { background: linear-gradient(135deg, #004ba0, #0072ff); }
        .flag-RR { background: linear-gradient(135deg, #ea1a85, #ff60b5); }
        .flag-GT { background: linear-gradient(135deg, #1b2133, #3a4766); color: #e3c052; }
        .flag-PBKS { background: linear-gradient(135deg, #dd1d1d, #ff5252); }
        .flag-KKR { background: linear-gradient(135deg, #3a225d, #6b3ba7); color: #f7d070; }
        .flag-SRH { background: linear-gradient(135deg, #f26522, #ff8c52); }
        .flag-DC { background: linear-gradient(135deg, #00488e, #0075eb); }
        .flag-LSG { background: linear-gradient(135deg, #a72056, #e6397e); }
        .flag-RCB { background: linear-gradient(135deg, #d11d11, #ff4d4d); }
        .flag-CSK { background: linear-gradient(135deg, #fcca06, #ffdf6d); color: #000; }

        .team-name {
            font-size: 13px;
            font-weight: 700;
            color: #f1f5f9;
            text-align: center;
            line-height: 1.3;
        }

        .vs-badge {
            font-size: 18px;
            font-weight: 900;
            color: #64748b;
            font-style: italic;
            background: rgba(255, 255, 255, 0.05);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Card Bottom */
        .card-bottom {
            padding: 16px 20px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stadium-name {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .preview-btn {
            background: linear-gradient(135deg, #5a38fd 0%, #3b82f6 100%);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(90, 56, 253, 0.4);
            transition: opacity 0.2s;
        }

        .preview-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Match Schedule</div>
    <div id="matches-list"></div>
</div>

<script>
    const matches = [
        { id: 1, team1: "MI", team1Name: "Mumbai Indians", team2: "RR", team2Name: "Rajasthan Royals", venue: "Wankhede Stadium, Mumbai" },
        { id: 2, team1: "GT", team1Name: "Gujarat Titans", team2: "PBKS", team2Name: "Punjab Kings", venue: "Narendra Modi Stadium, Ahmedabad" },
        { id: 3, team1: "KKR", team1Name: "Kolkata Knight Riders", team2: "SRH", team2Name: "Sunrisers Hyderabad", venue: "Eden Gardens, Kolkata" },
        { id: 4, team1: "DC", team1Name: "Delhi Capitals", team2: "LSG", team2Name: "Lucknow Super Giants", venue: "Arun Jaitley Stadium, Delhi" },
        { id: 5, team1: "PBKS", team1Name: "Punjab Kings", team2: "MI", team2Name: "Mumbai Indians", venue: "HPCA Stadium, Dharamshala" },
        { id: 6, team1: "KKR", team1Name: "Kolkata Knight Riders", team2: "DC", team2Name: "Delhi Capitals", venue: "Eden Gardens, Kolkata" }
    ];

    const listContainer = document.getElementById('matches-list');

    matches.forEach((match) => {
        const cardHTML = `
            <div class="match-card" style="margin-bottom: 20px;">
                <div class="card-top">
                    <span class="date-badge">TBC</span>
                    <div class="time-badge">
                        <span class="dot"></span> 7:30 PM IST
                    </div>
                </div>
                <div class="card-banner">
                    <div class="match-number">Match ${match.id}</div>
                    <div class="teams-container">
                        <div class="team">
                            <div class="flag flag-${match.team1}">${match.team1}</div>
                            <div class="team-name">${match.team1Name}</div>
                        </div>
                        <div class="vs-badge">VS</div>
                        <div class="team">
                            <div class="flag flag-${match.team2}">${match.team2}</div>
                            <div class="team-name">${match.team2Name}</div>
                        </div>
                    </div>
                </div>
                <div class="card-bottom">
                    <div class="stadium-name">${match.venue}</div>
                    <button class="preview-btn">Match Preview &rarr;</button>
                </div>
            </div>
        `;
        listContainer.innerHTML += cardHTML;
    });
</script>

</body>
</html>
