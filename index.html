<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .schedule-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .match-card {
      background: #ffffff;
      border-radius: 20px;
      border: 3px solid #ff9900;
      border-image: linear-gradient(135deg, #ff9900, #ff0055, #2e3192) 1;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }
    .card-header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      font-weight: 800;
      color: #000000;
      font-size: 14px;
    }
    .time-text {
      color: #333333;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .time-dot {
      width: 8px;
      height: 8px;
      background-color: #cccccc;
      border-radius: 50%;
      display: inline-block;
    }
    .card-body {
      background: linear-gradient(135deg, #050b5e, #1a237e);
      padding: 20px 10px;
      color: #ffffff;
      text-align: center;
      position: relative;
    }
    .match-number {
      background: rgba(0,0,0,0.5);
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .teams-vs {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 5px;
    }
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    
    /* Points Table Style Square Logos */
    .team-logo {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .team-logo svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }
    .team-name {
      font-size: 13px;
      font-weight: 700;
      max-width: 110px;
      line-height: 1.2;
    }
    .vs-badge {
      font-size: 24px;
      font-weight: 900;
      color: #ffcc00;
      padding: 0 10px;
      font-style: italic;
    }
    .card-footer {
      background: #ffffff;
      padding: 16px;
      text-align: center;
    }
    .venue-name {
      font-size: 15px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 12px;
    }
    .preview-btn {
      background: #100e68;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
