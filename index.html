<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL Match Schedule</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    background-color: #0b0633;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
  }

  .header {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(135deg, #180344, #08011c);
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .header h1 {
    font-size: 20px;
    color: #00d2ff;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Outer Card Gradient Border */
  .card {
    background: linear-gradient(180deg, #facc15 0%, #ec4899 50%, #3b82f6 100%);
    border-radius: 28px;
    padding: 3px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .card-inner {
    background: #ffffff;
    border-radius: 25px;
    overflow: hidden;
    color: #000;
  }

  /* Header Section */
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px 12px 24px;
    background: #ffffff;
  }

  .match-date {
    font-size: 18px;
    font-weight: 800;
    color: #111827;
  }

  .match-time {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #6b7280;
    font-size: 13px;
    font-weight: 600;
  }

  .time-dot {
    width: 14px;
    height: 14px;
    background-color: #d1d5db;
    border-radius: 50%;
  }

  /* Banner Section */
  .banner {
    background: #0f0550;
    position: relative;
    padding: 12px 10px 20px 10px;
    text-align: center;
    overflow: hidden;
  }

  /* Geometric SVG Background Patterns */
  .banner-pattern {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.9;
  }

  .match-number-badge {
    background: #110842;
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 12px;
    display: inline-block;
    margin-bottom: 12px;
    position: relative;
    z-index: 2;
  }

  .teams-container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 40%;
  }

  /* Circular Logo Box */
  .team-logo-box {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #e5e7eb;
    margin-bottom: 6px;
    padding: 6px;
  }

  .team-logo-box svg {
    width: 100%;
    height: 100%;
  }

  .team-name {
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    text-align: center;
    line-height: 1.2;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  .vs-badge {
    color: #ffffff;
    font-size: 32px;
    font-weight: 900;
    font-style: normal;
    letter-spacing: 1px;
  }

  /* Footer Section */
  .card-footer {
    padding: 16px 20px 20px 20px;
    text-align: center;
    background: #ffffff;
    position: relative;
  }

  /* Footer Bottom Graphics */
  .footer-pattern {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .venue {
    font-size: 16px;
    font-weight: 800;
    color: #0d1117;
    margin-bottom: 16px;
    line-height: 1.25;
    position: relative;
    z-index: 2;
    padding: 0 10px;
  }

  .btn {
    background: #0d0658;
    color: #ffffff;
    border: none;
    padding: 10px 28px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 2;
    box-shadow: 0 4px 10px rgba(13, 6, 88, 0.3);
  }
</style>
</head>
<body>

<div class="header">
  <h1>IPL Match Schedule</h1>
</div>

<div class="container" id="schedule-container"></div>

<script>
const teamsData = {
  CSK: { name: "Chennai Super Kings", bg: "#d4a017", svg: '<path fill="#d4a017" d="M30 20 L50 35 L70 20 L60 55 L80 40 L65 70 L50 60 L35 70 L20 40 L40 55 Z"/>' },
  RCB: { name: "Royal Challengers Bengaluru", bg: "#be123c", svg: '<path fill="#be123c" d="M30 25 C30 25 50 15 70 25 C70 45 60 75 50 85 C40 75 30 45 30 25 Z"/>' },
  MI: { name: "Mumbai Indians", bg: "#0284c7", svg: '<path fill="#0284c7" d="M50 20 L60 40 L80 50 L60 60 L50 80 L40 60 L20 50 L40 40 Z"/>' },
  KKR: { name: "Kolkata Knight Riders", bg: "#4c1d95", svg: '<path fill="#4c1d95" d="M50 15 L75 30 L65 75 L50 85 L35 75 L25 30 Z"/>' },
  GT: { name: "Gujarat Titans", bg: "#0f172a", svg: '<polygon fill="#0f172a" points="55,15 30,50 48,50 42,85 70,45 52,45"/>' },
  RR: { name: "Rajasthan Royals", bg: "#db2777", svg: '<path fill="#db2777" d="M20 35 L35 50 L50 25 L65 50 L80 35 L75 70 L25 70 Z"/>' },
  SRH: { name: "Sunrisers Hyderabad", bg: "#ea580c", svg: '<path fill="#ea580c" d="M20 50 C20 30 80 30 80 50 C70 40 60 65 50 65 C40 65 30 40 20 50 Z"/>' },
  LSG: { name: "Lucknow Super Giants", bg: "#7f1d1d", svg: '<path fill="#7f1d1d" d="M50 15 L80 35 L65 70 L50 60 L35 70 L20 35 Z"/>' },
  DC: { name: "Delhi Capitals", bg: "#1e3a8a", svg: '<path fill="#1e3a8a" d="M30 40 L50 20 L70 40 L70 75 L30 75 Z"/>' },
  PBKS: { name: "Punjab Kings", bg: "#dc2626", svg: '<path fill="#dc2626" d="M30 20 L70 20 L70 60 L50 80 L30 60 Z"/>' }
};

const venuesData = {
  CSK: "M. A. Chidambaram Stadium, Chennai",
  RCB: "M. Chinnaswamy Stadium, Bengaluru",
  MI: "Wankhede Stadium, Mumbai",
  KKR: "Eden Gardens, Kolkata",
  GT: "Narendra Modi Stadium, Ahmedabad",
  RR: "Sawai Mansingh Stadium, Jaipur",
  SRH: "Rajiv Gandhi Intl Stadium, Hyderabad",
  LSG: "BRSABV Ekana Stadium, Lucknow",
  DC: "Arun Jaitley Stadium, Delhi",
  PBKS: "HPCA Stadium, Dharamshala"
};

function getLogoSVG(code) {
  const data = teamsData[code];
  return `<div class="team-logo-box">
    <svg viewBox="0 0 100 100">${data.svg}</svg>
  </div>`;
}

// Generate raw matches pool
let matchPool = [];

for (let i = 0; i < 7; i++) {
  matchPool.push({ team1: "CSK", team2: "RCB", venue: venuesData.CSK });
  matchPool.push({ team1: "RCB", team2: "CSK", venue: venuesData.RCB });
}

const otherTeams = ["MI", "KKR", "GT", "RR", "SRH", "LSG", "DC", "PBKS"];
for (let i = 0; i < otherTeams.length; i++) {
  for (let j = i + 1; j < otherTeams.length; j++) {
    const t1 = otherTeams[i];
    const t2 = otherTeams[j];
    matchPool.push({ team1: t1, team2: t2, venue: venuesData[t1] });
    matchPool.push({ team1: t2, team2: t1, venue: venuesData[t2] });
  }
}

const match1Idx = matchPool.findIndex(m => m.team1 === "GT" && m.team2 === "RR");
const match1 = matchPool.splice(match1Idx, 1)[0];

const match5Idx = matchPool.findIndex(m => m.team1 === "CSK" && m.team2 === "RCB");
const match5 = matchPool.splice(match5Idx, 1)[0];

const finalSchedule = new Array(70);
finalSchedule[0] = match1;
finalSchedule[4] = match5;

let lastTeams = new Set([match1.team1, match1.team2]);

for (let slot = 1; slot < 70; slot++) {
  if (slot === 4) {
    lastTeams = new Set([match5.team1, match5.team2]);
    continue;
  }

  let foundIndex = -1;
  for (let i = 0; i < matchPool.length; i++) {
    const candidate = matchPool[i];
    if (!lastTeams.has(candidate.team1) && !lastTeams.has(candidate.team2)) {
      foundIndex = i;
      break;
    }
  }

  if (foundIndex === -1) foundIndex = 0;

  const selectedMatch = matchPool.splice(foundIndex, 1)[0];
  finalSchedule[slot] = selectedMatch;
  lastTeams = new Set([selectedMatch.team1, selectedMatch.team2]);
}

// Render Matches
const container = document.getElementById("schedule-container");

// Background Geometric Pattern SVGs
const bgPatternsSVG = `
  <svg class="banner-pattern" viewBox="0 0 400 150" preserveAspectRatio="none">
    <path d="M-20 0 L40 60 L-20 120 Z" fill="#f59e0b" opacity="0.8"/>
    <path d="M380 -10 L420 40 L360 80 Z" fill="#ec4899" opacity="0.8"/>
    <path d="M120 110 L160 160 L200 110 L180 160 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M220 110 L250 160 L280 110 Z" fill="#ec4899" opacity="0.9"/>
  </svg>
`;

const footerPatternsSVG = `
  <svg class="footer-pattern" viewBox="0 0 400 120" preserveAspectRatio="none">
    <path d="M0 40 L30 10 L45 50 L20 80 L0 60 Z" fill="#f59e0b" opacity="0.8"/>
    <path d="M0 80 L35 120 L0 120 Z" fill="#ec4899" opacity="0.8"/>
    <path d="M370 40 L400 20 L400 80 L380 100 Z" fill="#8b5cf6" opacity="0.8"/>
    <path d="M350 90 L400 120 L350 120 Z" fill="#ec4899" opacity="0.8"/>
  </svg>
`;

finalSchedule.forEach((match, index) => {
  const card = document.createElement("div");
  card.className = "card";
  
  const dateStr = "Aug, Fri 21";
  const timeStr = index % 2 === 0 ? "3:00 pm IST" : "7:30 pm IST";

  card.innerHTML = `
    <div class="card-inner">
      <div class="card-header">
        <span class="match-date">${dateStr}</span>
        <div class="match-time">
          <div class="time-dot"></div>
          <span>${timeStr}</span>
        </div>
      </div>
      <div class="banner">
        ${bgPatternsSVG}
        <div class="match-number-badge">Match ${index + 1}</div>
        <div class="teams-container">
          <div class="team">
            ${getLogoSVG(match.team1)}
            <div class="team-name">${teamsData[match.team1].name}</div>
          </div>
          <div class="vs-badge">VS</div>
          <div class="team">
            ${getLogoSVG(match.team2)}
            <div class="team-name">${teamsData[match.team2].name}</div>
          </div>
        </div>
      </div>
      <div class="card-footer">
        ${footerPatternsSVG}
        <div class="venue">${match.venue}</div>
        <button class="btn">Match Preview &gt;</button>
      </div>
    </div>
  `;
  container.appendChild(card);
});
</script>

</body>
</html>
