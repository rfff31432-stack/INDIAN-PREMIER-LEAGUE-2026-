<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Schedule & Points Table</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .admin-bar { width: 100%; max-width: 480px; display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .admin-toggle-btn { background: #100e68; color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .global-control-card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 16px; padding: 16px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); border: 2px solid #ff9900; margin-bottom: 20px; display: none; }
    .control-title { font-size: 14px; font-weight: 800; color: #100e68; margin-bottom: 10px; text-transform: uppercase; text-align: center; }
    .form-group { display: flex; flex-direction: column; gap: 10px; }
    .form-row { display: flex; gap: 10px; align-items: center; }
    .form-row input, .form-row select { flex: 1; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    .checkbox-label { font-size: 11px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 4px; }
    .update-btn { background: linear-gradient(135deg, #100e68, #1a237e); color: #ffffff; border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 5px; }
    .table-card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); margin-bottom: 25px; padding: 15px; border: 2px solid #1a237e; }
    .table-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .table-title { font-size: 16px; font-weight: 800; color: #100e68; text-transform: uppercase; }
    .reset-btn { background: #dd1d25; color: #fff; border: none; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; display: none; }
    .points-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
    .points-table th { background-color: #1a237e; color: white; padding: 8px 4px; }
    .points-table td { padding: 8px 4px; border-bottom: 1px solid #ddd; font-weight: 600; }
    .points-table tr:nth-child(even) { background-color: #f9f9f9; }
    .schedule-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    .match-card { background: #ffffff; border-radius: 20px; border: 3px solid #ff9900; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .card-header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; background: #ffffff; font-weight: 800; color: #000000; font-size: 14px; }
    .time-text { color: #333333; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .time-dot { width: 8px; height: 8px; background-color: #cccccc; border-radius: 50%; display: inline-block; }
    .card-body { background: linear-gradient(135deg, #050b5e, #1a237e); padding: 20px 10px; color: #ffffff; text-align: center; }
    .match-number { background: rgba(0,0,0,0.5); padding: 4px 14px; border-radius: 12px; font-size: 11px; font-weight: 700; display: inline-block; margin-bottom: 12px; text-transform: uppercase; }
    .teams-vs { display: flex; justify-content: space-around; align-items: center; }
    .team { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .team-logo { width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); }
    .team-logo svg { width: 30px; height: 30px; fill: #ffffff; }
    .team-name { font-size: 13px; font-weight: 700; }
    .vs-badge { font-size: 24px; font-weight: 900; color: #ffcc00; padding: 0 10px; }
    .card-footer { background: #ffffff; padding: 12px 16px; text-align: center; }
    .venue-name { font-size: 14px; font-weight: 800; color: #111111; }
    .match-status { font-size: 12px; font-weight: bold; color: #008000; margin-top: 6px; }
    .section-divider { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ff9900; }
  </style>
</head>
<body>

<div class="admin-bar">
  <button class="admin-toggle-btn" id="adminBtn" onclick="toggleAdmin()">Admin Login</button>
</div>

<div class="global-control-card" id="adminPanel">
  <div class="control-title">1. Result & Scorecard Update (ICC NRR)</div>
  <div class="form-group">
    <select id="globalMatchSelect" onchange="populateTeams()">
      <option value="">-- Select Match --</option>
    </select>
    
    <div style="font-size: 11px; font-weight: bold; color: #100e68;" id="team1Label">Team 1 Score</div>
    <div class="form-row">
      <input type="number" id="t1Runs" placeholder="Runs" min="0">
      <input type="number" id="t1Overs" placeholder="Overs (e.g. 20 ya 18.3)" step="0.1" min="0" max="20">
      <label class="checkbox-label"><input type="checkbox" id="t1AllOut"> All Out?</label>
    </div>

    <div style="font-size: 11px; font-weight: bold; color: #100e68;" id="team2Label">Team 2 Score</div>
    <div class="form-row">
      <input type="number" id="t2Runs" placeholder="Runs" min="0">
      <input type="number" id="t2Overs" placeholder="Overs (e.g. 20 ya 19.1)" step="0.1" min="0" max="20">
      <label class="checkbox-label"><input type="checkbox" id="t2AllOut"> All Out?</label>
    </div>

    <button class="update-btn" onclick="submitGlobalMatch()">Update Scorecard</button>
  </div>

  <div class="section-divider"></div>

  <div class="control-title">2. Edit Teams / Date / Time / Venue</div>
  <div class="form-group">
    <div class="form-row">
      <select id="editTeam1Select"><option value="">Team 1 Choose...</option></select>
      <select id="editTeam2Select"><option value="">Team 2 Choose...</option></select>
    </div>
    <div class="form-row">
      <input type="text" id="editMatchDate" placeholder="Date (e.g. 24 May 2026)">
      <input type="text" id="editMatchTime" placeholder="Time (e.g. 7:30 PM)">
    </div>
    <div class="form-row">
      <input type="text" id="editVenue" placeholder="Venue Name">
    </div>
    <button class="update-btn" style="background: #e64a19;" onclick="updateMatchDetails()">Save Match Details</button>
  </div>
</div>

<div class="table-card">
  <div class="table-header-flex">
    <div class="table-title">IPL Points Table</div>
    <button class="reset-btn" id="resetBtn" onclick="resetAllData()">Reset All</button>
  </div>
  <table class="points-table">
    <thead>
      <tr>
        <th>Pos</th>
        <th style="text-align:left;">Team</th>
        <th>P</th>
        <th>W</th>
        <th>L</th>
        <th>Pts</th>
        <th>NRR</th>
      </tr>
    </thead>
    <tbody id="pointsTableBody"></tbody>
  </table>
</div>

<div class="schedule-container" id="schedule"></div>

<script>
const ADMIN_PASSWORD = "admin";
let isAdmin = false;

function toggleAdmin() {
  if (!isAdmin) {
    const password = prompt("Admin Password darj karein:");
    if (password === ADMIN_PASSWORD) {
      isAdmin = true;
      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('resetBtn').style.display = 'block';
      document.getElementById('adminBtn').innerText = 'Admin Logout';
      alert("Admin Mode Active!");
    } else if (password !== null) {
      alert("Galat Password!");
    }
  } else {
    isAdmin = false;
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('resetBtn').style.display = 'none';
    document.getElementById('adminBtn').innerText = 'Admin Login';
  }
}

const teamData = {
  "Mumbai Indians": { short: "MI", venue: "Wankhede Stadium, Mumbai", bg: "#004ba0", svg: `<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>` },
  "Kolkata Knight Riders": { short: "KKR", venue: "Eden Gardens, Kolkata", bg: "#2e1437", svg: `<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>` },
  "Gujarat Titans": { short: "GT", venue: "Narendra Modi Stadium, Ahmedabad", bg: "#0b1326", svg: `<svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>` },
  "Rajasthan Royals": { short: "RR", venue: "Sawai Mansingh Stadium, Jaipur", bg: "#d6156c", svg: `<svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>` },
  "Lucknow Super Giants": { short: "LSG", venue: "Ekana Cricket Stadium, Lucknow", bg: "#6b0000", svg: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>` },
  "Punjab Kings": { short: "PBKS", venue: "HPCA Stadium, Dharamshala", bg: "#dd1d25", svg: `<svg viewBox="0 0 24 24"><path d="M12 2L4 5v6c0 5.25 3.4 10.2 8 11.5 4.6-1.3 8-6.25 8-11.5V5l-8-3zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/></svg>` },
  "Delhi Capitals": { short: "DC", venue: "Arun Jaitley Stadium, Delhi", bg: "#002f6c", svg: `<svg viewBox="0 0 24 24"><path d="M12 1L2 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-10-5zm0 4a3 3 0 110 6 3 3 0 010-6z"/></svg>` },
  "Sunrisers Hyderabad": { short: "SRH", venue: "Rajiv Gandhi Stadium, Hyderabad", bg: "#e64a19", svg: `<svg viewBox="0 0 24 24"><path d="M12 2.59l5.7 5.7-1.42 1.42L13 6.41V16h-2V6.41l-3.28 3.3-1.42-1.42L12 2.59zM4 18h16v2H4z"/></svg>` },
  "TBC": { short: "TBC", venue: "TBD", bg: "#4A5568", svg: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>` }
};

function generateBaseSchedule() {
  const teamList = Object.keys(teamData).filter(t => t !== "TBC");
  let rawFixtures = [];

  // Double Round-Robin (56 League Matches, 7 Home, 7 Away per team)
  for (let i = 0; i < teamList.length; i++) {
    for (let j = 0; j < teamList.length; j++) {
      if (i !== j) {
        rawFixtures.push({ t1: teamList[i], t2: teamList[j], venue: teamData[teamList[i]].venue });
      }
    }
  }

  // Strictly Enforced Gap Scheduling Algorithm (Min 3 to 4 Matches Gap)
  let orderedFixtures = [];
  let lastPlayed = {};
  teamList.forEach(t => lastPlayed[t] = -10);

  while (rawFixtures.length > 0) {
    let bestIndex = -1;
    let maxGap = -1;

    for (let k = 0; k < rawFixtures.length; k++) {
      const f = rawFixtures[k];
      const gapT1 = orderedFixtures.length - lastPlayed[f.t1];
      const gapT2 = orderedFixtures.length - lastPlayed[f.t2];

      // Minimum gap threshold: 4 matches between team games
      if (gapT1 >= 4 && gapT2 >= 4) {
        const minGap = Math.min(gapT1, gapT2);
        if (minGap > maxGap) {
          maxGap = minGap;
          bestIndex = k;
        }
      }
    }

    // Fallback if ideal gap is not strictly possible at final tail
    if (bestIndex === -1) {
      let maxPossibleGap = -1;
      for (let k = 0; k < rawFixtures.length; k++) {
        const f = rawFixtures[k];
        const gapT1 = orderedFixtures.length - lastPlayed[f.t1];
        const gapT2 = orderedFixtures.length - lastPlayed[f.t2];
        const minGap = Math.min(gapT1, gapT2);
        if (minGap > maxPossibleGap) {
          maxPossibleGap = minGap;
          bestIndex = k;
        }
      }
    }

    const chosen = rawFixtures.splice(bestIndex, 1)[0];
    orderedFixtures.push(chosen);
    lastPlayed[chosen.t1] = orderedFixtures.length - 1;
    lastPlayed[chosen.t2] = orderedFixtures.length - 1;
  }

  let schedule = [];
  orderedFixtures.forEach((f, idx) => {
    schedule.push({
      id: String(idx + 1),
      title: `Match ${idx + 1}`,
      t1: f.t1,
      t2: f.t2,
      venue: f.venue,
      date: "Date TBD",
      time: "7:30 PM",
      isPlayoff: false
    });
  });

  // Playoff Matches
  schedule.push({ id: "57", title: "1st Qualifier", t1: "TBC", t2: "TBC", venue: "Eden Gardens, Kolkata", date: "Date TBD", time: "7:30 PM", isPlayoff: true });
  schedule.push({ id: "58", title: "Eliminator", t1: "TBC", t2: "TBC", venue: "Wankhede Stadium, Mumbai", date: "Date TBD", time: "7:30 PM", isPlayoff: true });
  schedule.push({ id: "59", title: "2nd Qualifier", t1: "TBC", t2: "TBC", venue: "Ekana Cricket Stadium, Lucknow", date: "Date TBD", time: "7:30 PM", isPlayoff: true });
  schedule.push({ id: "60", title: "Final", t1: "TBC", t2: "TBC", venue: "TBC", date: "Date TBD", time: "7:30 PM", isPlayoff: true });

  return schedule;
}

let matches = JSON.parse(localStorage.getItem('iplCustomScheduleV5')) || generateBaseSchedule();
let matchResults = JSON.parse(localStorage.getItem('iplMatchResultsV5')) || {};
let pointsTable = {};

function getICCAdjustedOvers(oversInput, isAllOut) {
  if (isAllOut) return 20.0;
  const parts = String(oversInput).split('.');
  const fullOvers = parseInt(parts[0], 10) || 0;
  const balls = parts[1] ? parseInt(parts[1], 10) : 0;
  return fullOvers + (balls / 6);
}

function initPointsTable() {
  pointsTable = {};
  Object.keys(teamData).filter(t => t !== "TBC").forEach(team => {
    pointsTable[team] = { p: 0, w: 0, l: 0, pts: 0, runsScored: 0, oversFaced: 0, runsConceded: 0, oversBowled: 0, nrr: 0 };
  });
}

function calculateTable() {
  initPointsTable();
  
  Object.keys(matchResults).forEach(idx => {
    const res = matchResults[idx];
    const m = matches[idx];
    if (m && res && !m.isPlayoff) {
      const t1 = m.t1;
      const t2 = m.t2;

      if (t1 !== "TBC" && t2 !== "TBC" && pointsTable[t1] && pointsTable[t2]) {
        const t1OversComp = getICCAdjustedOvers(res.t1Overs, res.t1AllOut);
        const t2OversComp = getICCAdjustedOvers(res.t2Overs, res.t2AllOut);

        pointsTable[t1].p += 1;
        pointsTable[t2].p += 1;

        pointsTable[t1].runsScored += res.t1Runs;
        pointsTable[t1].oversFaced += t1OversComp;
        pointsTable[t1].runsConceded += res.t2Runs;
        pointsTable[t1].oversBowled += t2OversComp;

        pointsTable[t2].runsScored += res.t2Runs;
        pointsTable[t2].oversFaced += t2OversComp;
        pointsTable[t2].runsConceded += res.t1Runs;
        pointsTable[t2].oversBowled += t1OversComp;

        if (res.t1Runs > res.t2Runs) {
          pointsTable[t1].w += 1;
          pointsTable[t1].pts += 2;
          pointsTable[t2].l += 1;
        } else if (res.t2Runs > res.t1Runs) {
          pointsTable[t2].w += 1;
          pointsTable[t2].pts += 2;
          pointsTable[t1].l += 1;
        }
      }
    }
  });

  Object.keys(pointsTable).forEach(team => {
    const t = pointsTable[team];
    if (t.oversFaced > 0 && t.oversBowled > 0) {
      const runRateFor = t.runsScored / t.oversFaced;
      const runRateAgainst = t.runsConceded / t.oversBowled;
      t.nrr = runRateFor - runRateAgainst;
    } else {
      t.nrr = 0;
    }
  });

  renderPointsTable();
}

function renderPointsTable() {
  const tbody = document.getElementById('pointsTableBody');
  tbody.innerHTML = '';
  
  const sorted = Object.keys(pointsTable).sort((a, b) => {
    if (pointsTable[b].pts !== pointsTable[a].pts) {
      return pointsTable[b].pts - pointsTable[a].pts;
    }
    return pointsTable[b].nrr - pointsTable[a].nrr;
  });

  sorted.forEach((team, index) => {
    const d = pointsTable[team];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td style="text-align:left;">${teamData[team].short}</td>
      <td>${d.p}</td>
      <td>${d.w}</td>
      <td>${d.l}</td>
      <td>${d.pts}</td>
      <td>${d.nrr > 0 ? '+' + d.nrr.toFixed(3) : d.nrr.toFixed(3)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function renderMatches() {
  const container = document.getElementById('schedule');
  const matchSelect = document.getElementById('globalMatchSelect');
  const team1Select = document.getElementById('editTeam1Select');
  const team2Select = document.getElementById('editTeam2Select');

  container.innerHTML = '';
  matchSelect.innerHTML = '<option value="">-- Select Match --</option>';
  
  team1Select.innerHTML = '<option value="">Team 1 Choose...</option>';
  team2Select.innerHTML = '<option value="">Team 2 Choose...</option>';
  Object.keys(teamData).forEach(t => {
    team1Select.innerHTML += `<option value="${t}">${t}</option>`;
    team2Select.innerHTML += `<option value="${t}">${t}</option>`;
  });

  matches.forEach((m, idx) => {
    const team1 = teamData[m.t1] || teamData["TBC"];
    const team2 = teamData[m.t2] || teamData["TBC"];

    const opt = document.createElement('option');
    opt.value = idx;
    opt.innerText = `${m.title}: ${team1.short} vs ${team2.short}`;
    matchSelect.appendChild(opt);

    const savedRes = matchResults[idx];
    let statusText = '';
    if (savedRes) {
      const winnerName = savedRes.t1Runs > savedRes.t2Runs ? team1.short : team2.short;
      statusText = `Winner: ${winnerName} (${team1.short}: ${savedRes.t1Runs}/${savedRes.t1Overs}ov | ${team2.short}: ${savedRes.t2Runs}/${savedRes.t2Overs}ov)`;
    }

    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="card-header">
        <span>${m.date}</span>
        <span class="time-text"><span class="time-dot"></span> ${m.time} IST</span>
      </div>
      <div class="card-body">
        <div class="match-number">${m.title}</div>
        <div class="teams-vs">
          <div class="team">
            <div class="team-logo" style="background-color: ${team1.bg}">${team1.svg}</div>
            <div class="team-name">${team1.short}</div>
          </div>
          <div class="vs-badge">VS</div>
          <div class="team">
            <div class="team-logo" style="background-color: ${team2.bg}">${team2.svg}</div>
            <div class="team-name">${team2.short}</div>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <div class="venue-name">${m.venue}</div>
        <div class="match-status">${statusText}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function populateTeams() {
  const idx = document.getElementById('globalMatchSelect').value;
  if (idx !== "") {
    const m = matches[idx];
    const t1Name = teamData[m.t1] ? teamData[m.t1].short : m.t1;
    const t2Name = teamData[m.t2] ? teamData[m.t2].short : m.t2;

    document.getElementById('team1Label').innerText = `${t1Name} Score & Overs:`;
    document.getElementById('team2Label').innerText = `${t2Name} Score & Overs:`;

    document.getElementById('editTeam1Select').value = m.t1;
    document.getElementById('editTeam2Select').value = m.t2;
    document.getElementById('editMatchDate').value = m.date !== "Date TBD" ? m.date : "";
    document.getElementById('editMatchTime').value = m.time;
    document.getElementById('editVenue').value = m.venue;
  }
}

function submitGlobalMatch() {
  if (!isAdmin) return alert("Keval Admin hi result update kar sakta hai!");

  const idx = document.getElementById('globalMatchSelect').value;
  const t1Runs = parseInt(document.getElementById('t1Runs').value, 10);
  const t1Overs = parseFloat(document.getElementById('t1Overs').value);
  const t1AllOut = document.getElementById('t1AllOut').checked;

  const t2Runs = parseInt(document.getElementById('t2Runs').value, 10);
  const t2Overs = parseFloat(document.getElementById('t2Overs').value);
  const t2AllOut = document.getElementById('t2AllOut').checked;

  if (idx === "" || isNaN(t1Runs) || isNaN(t1Overs) || isNaN(t2Runs) || isNaN
