<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Match Schedule 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0742; color: #fff; padding: 20px 10px; display: flex; justify-content: center; }
    .schedule-container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 20px; }
    .match-card {
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      border: 3px solid #f9a825;
      color: #333;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .card-header {
      background: #ffffff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #000;
      border-bottom: 1px solid #eee;
    }
    .time-badge { font-size: 0.85rem; color: #555; display: flex; align-items: center; gap: 5px; }
    .time-badge::before { content: '●'; color: #ccc; font-size: 0.6rem; }
    .card-body {
      background: linear-gradient(135deg, #100572 0%, #080047 100%);
      padding: 20px 15px;
      text-align: center;
      color: #fff;
      position: relative;
    }
    .match-number {
      background: rgba(0,0,0,0.4);
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      display: inline-block;
      margin-bottom: 15px;
    }
    .teams-vs { display: flex; justify-content: space-around; align-items: center; margin-bottom: 10px; }
    .team { display: flex; flex-direction: column; align-items: center; width: 40%; }
    .team-badge {
      width: 55px; height: 55px; border-radius: 50%;
      background: #fff; color: #000; display: flex;
      align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.9rem; border: 3px solid #ff0055;
      margin-bottom: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .team-name { font-size: 0.85rem; font-weight: 700; text-align: center; }
    .vs-text { font-size: 1.8rem; font-weight: 900; font-style: italic; color: #fff; }
    .card-footer {
      background: #fff; padding: 15px; text-align: center; color: #111;
    }
    .stadium { font-weight: 800; font-size: 0.95rem; margin-bottom: 12px; }
    .preview-btn {
      background: #110066; color: #fff; border: none;
      padding: 10px 25px; border-radius: 20px; font-weight: bold;
      font-size: 0.85rem; cursor: pointer; transition: 0.3s;
    }
    .preview-btn:hover { background: #ff0055; }
  </style>
</head>
<body>

<div class="schedule-container" id="schedule"></div>

<script>
  // 8 Teams & Specific Venues requested
  const teams = [
    { code: 'MI', name: 'Mumbai Indians', stadium: 'Wankhede Stadium, Mumbai' },
    { code: 'KKR', name: 'Kolkata Knight Riders', stadium: 'Eden Gardens, Kolkata' },
    { code: 'SRH', name: 'Sunrisers Hyderabad', stadium: 'Rajiv Gandhi Stadium, Hyderabad' },
    { code: 'RR', name: 'Rajasthan Royals', stadium: 'Sawai Mansingh Stadium, Jaipur' },
    { code: 'DC', name: 'Delhi Capitals', stadium: 'Arun Jaitley Stadium, Delhi' },
    { code: 'PBKS', name: 'Punjab Kings', stadium: 'HPCA Stadium, Dharamshala' },
    { code: 'GT', name: 'Gujarat Titans', stadium: 'Narendra Modi Stadium, Ahmedabad' },
    { code: 'LSG', name: 'Lucknow Super Giants', stadium: 'BRSABV Ekana Stadium, Lucknow' }
  ];

  // Round Robin Generation Logic with Gap Distribution
  let rounds = [];
  const n = teams.length;

  // Leg 1 (Home vs Away) & Leg 2 (Away vs Home)
  for (let leg = 0; leg < 2; leg++) {
    for (let r = 0; r < n - 1; r++) {
      let roundMatches = [];
      for (let i = 0; i < n / 2; i++) {
        let home = (r + i) % (n - 1);
        let away = (n - 1 - i + r) % (n - 1);
        if (i === 0) away = n - 1;
        
        if (leg === 1) { [home, away] = [away, home]; }
        roundMatches.push({ home: teams[home], away: teams[away] });
      }
      rounds.push(roundMatches);
    }
  }

  // Interleave round matches to give 2-3 match gap for every team
  let finalMatches = [];
  for (let matchIndex = 0; matchIndex < n / 2; matchIndex++) {
    for (let roundIndex = 0; roundIndex < rounds.length; roundIndex++) {
      finalMatches.push(rounds[roundIndex][matchIndex]);
    }
  }

  // Render Schedule to UI
  const container = document.getElementById('schedule');

  finalMatches.forEach((m, index) => {
    const matchNum = index + 1;
    const timeStr = (matchNum % 2 === 0) ? '7:30 pm IST' : '3:30 pm IST';

    const card = `
      <div class="match-card">
        <div class="card-header">
          <span>TBD</span>
          <span class="time-badge">${timeStr}</span>
        </div>
        <div class="card-body">
          <div class="match-number">Match ${matchNum}</div>
          <div class="teams-vs">
            <div class="team">
              <div class="team-badge">${m.home.code}</div>
              <div class="team-name">${m.home.name}</div>
            </div>
            <div class="vs-text">VS</div>
            <div class="team">
              <div class="team-badge">${m.away.code}</div>
              <div class="team-name">${m.away.name}</div>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <div class="stadium">${m.home.stadium}</div>
          <button class="preview-btn">Match Preview &gt;</button>
        </div>
      </div>
    `;
    container.innerHTML += card;
  });
</script>
</body>
</html>
