    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Match Schedule</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0730;
            color: #ffffff;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            padding: 10px 0;
            letter-spacing: 1px;
        }

        /* Match Card Styling */
        .match-card {
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #5a38fd;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .card-top {
            background: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #000;
            font-weight: bold;
            font-size: 14px;
        }

        .time-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
            font-size: 13px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            border-radius: 50%;
            display: inline-block;
        }

        /* BANNER AREA */
        .card-banner {
            background: linear-gradient(135deg, #180056 0%, #2f0791 100%);
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .match-number {
            background: #140538;
            color: #fff;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .teams-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 35%;
        }

        /* Flag / Badge Style */
        .flag {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 2px solid #ffffff;
            margin-bottom: 8px;
        }

        /* Team Colors */
        .flag-MI { background: #004BA0; }
        .flag-RR { background: #EA1A85; }
        .flag-GT { background: #1B2133; color: #E3C052; }
        .flag-PBKS { background: #DD1D1D; }
        .flag-KKR { background: #3A225D; color: #F7D070; }
        .flag-SRH { background: #F26522; }
        .flag-DC { background: #00488E; }
        .flag-LSG { background: #A72056; }

        .team-name {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            line-height: 1.2;
        }

        .vs-badge {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            font-style: italic;
        }

        /* Card Bottom */
        .card-bottom {
            background: #ffffff;
            padding: 15px;
            text-align: center;
        }

        .stadium-name {
            color: #111;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .preview-btn {
            background: #18006e;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Match Schedule</div>
    <div id="matches-list"></div>
</div>

<script>
    const matches = [
        { id: 1, team1: "MI", team1Name: "Mumbai Indians", team2: "RR", team2Name: "Rajasthan Royals", venue: "Wankhede Stadium, Mumbai" },
        { id: 2, team1: "GT", team1Name: "Gujarat Titans", team2: "PBKS", team2Name: "Punjab Kings", venue: "Narendra Modi Stadium, Ahmedabad" },
        { id: 3, team1: "KKR", team1Name: "Kolkata Knight Riders", team2: "SRH", team2Name: "Sunrisers Hyderabad", venue: "Eden Gardens, Kolkata" },
        { id: 4, team1: "DC", team1Name: "Delhi Capitals", team2: "LSG", team2Name: "Lucknow Super Giants", venue: "Arun Jaitley Stadium, Delhi" },
        { id: 5, team1: "PBKS", team1Name: "Punjab Kings", team2: "MI", team2Name: "Mumbai Indians", venue: "HPCA Stadium, Dharamshala" },
        { id: 6, team1: "KKR", team1Name: "Kolkata Knight Riders", team2: "DC", team2Name: "Delhi Capitals", venue: "Eden Gardens, Kolkata" },
        { id: 7, team1: "SRH", team1Name: "Sunrisers Hyderabad", team2: "GT", team2Name: "Gujarat Titans", venue: "Rajiv Gandhi Stadium, Hyderabad" },
        { id: 8, team1: "LSG", team1Name: "Lucknow Super Giants", team2: "RR", team2Name: "Rajasthan Royals", venue: "Sawai Mansingh Stadium, Jaipur" },
        { id: 9, team1: "GT", team1Name: "Gujarat Titans", team2: "KKR", team2Name: "Kolkata Knight Riders", venue: "Narendra Modi Stadium, Ahmedabad" },
        { id: 10, team1: "MI", team1Name: "Mumbai Indians", team2: "SRH", team2Name: "Sunrisers Hyderabad", venue: "Wankhede Stadium, Mumbai" },
        { id: 11, team1: "LSG", team1Name: "Lucknow Super Giants", team2: "PBKS", team2Name: "Punjab Kings", venue: "BRSABV Ekana Stadium, Lucknow" },
        { id: 12, team1: "DC", team1Name: "Delhi Capitals", team2: "RR", team2Name: "Rajasthan Royals", venue: "Arun Jaitley Stadium, Delhi" },
        { id: 13, team1: "GT", team1Name: "Gujarat Titans", team2: "MI", team2Name: "Mumbai Indians", venue: "Narendra Modi Stadium, Ahmedabad" },
        { id: 14, team1: "KKR", team1Name: "Kolkata Knight Riders", team2: "RR", team2Name: "Rajasthan Royals", venue: "Sawai Mansingh Stadium, Jaipur" }
    ];

    const listContainer = document.getElementById('matches-list');

    matches.forEach((match) => {
        const cardHTML = `
            <div class="match-card" style="margin-bottom: 20px;">
                <div class="card-top">
                    <span>Match Date</span>
                    <div class="time-badge">
                        <span class="dot"></span> 7:30 pm IST
                    </div>
                </div>
                <div class="card-banner">
                    <div class="match-number">Match ${match.id}</div>
                    <div class="teams-container">
                        <div class="team">
                            <div class="flag flag-${match.team1}">${match.team1}</div>
                            <div class="team-name">${match.team1Name}</div>
                        </div>
                        <div class="vs-badge">VS</div>
                        <div class="team">
                            <div class="flag flag-${match.team2}">${match.team2}</div>
                            <div class="team-name">${match.team2Name}</div>
                        </div>
                    </div>
                </div>
                <div class="card-bottom">
                    <div class="stadium-name">${match.venue}</div>
                    <button class="preview-btn">Match Preview &gt;</button>
                </div>
            </div>
        `;
        listContainer.innerHTML += cardHTML;
    });
</script>

</body>
</html>
