<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL Match Schedule</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: #0d0630;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
  }

  .header {
    width: 100%;
    max-width: 450px;
    background: linear-gradient(135deg, #180344, #08011c);
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .header h1 {
    font-size: 22px;
    color: #00d2ff;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .container {
    width: 100%;
    max-width: 450px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: #ffffff;
    border-radius: 24px;
    padding: 3px;
    background: linear-gradient(135deg, #f39c12, #e74c3c, #8e44ad, #3498db);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .card-inner {
    background: #ffffff;
    border-radius: 21px;
    overflow: hidden;
    color: #333;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    font-weight: 700;
    font-size: 15px;
    color: #2c3e50;
  }

  .match-time {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #7f8c8d;
    font-size: 13px;
  }

  .time-dot {
    width: 12px;
    height: 12px;
    background-color: #bdc3c7;
    border-radius: 50%;
  }

  .banner {
    background: linear-gradient(135deg, #120338 0%, #00052e 100%);
    position: relative;
    padding: 20px 10px;
    text-align: center;
    overflow: hidden;
  }

  .match-number-badge {
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    font-size: 11px;
    padding: 3px 12px;
    border-radius: 12px;
    display: inline-block;
    margin-bottom: 10px;
  }

  .teams-container {
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 38%;
  }

  .team-logo-box {
    width: 55px;
    height: 55px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    margin-bottom: 8px;
  }

  .team-logo-box svg {
    width: 36px;
    height: 36px;
  }

  .team-name {
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
  }

  .vs-badge {
    color: #ffffff;
    font-size: 26px;
    font-weight: 900;
    font-style: italic;
  }

  .card-footer {
    padding: 15px;
    text-align: center;
    background: #ffffff;
  }

  .venue {
    font-size: 15px;
    font-weight: 800;
    color: #1a252f;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .btn {
    background: #1b025a;
    color: #ffffff;
    border: none;
    padding: 10px 24px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>IPL Match Schedule</h1>
</div>

<div class="container" id="schedule-container"></div>

<script>
const teamsData = {
  CSK: { name: "Chennai Super Kings", bg: "#d4a017", svg: '<path fill="#fff" d="M30 20 L50 35 L70 20 L60 55 L80 40 L65 70 L50 60 L35 70 L20 40 L40 55 Z"/>' },
  RCB: { name: "Royal Challengers Bengaluru", bg: "#be123c", svg: '<path fill="#fff" d="M30 25 C30 25 50 15 70 25 C70 45 60 75 50 85 C40 75 30 45 30 25 Z M45 40 L55 40 L50 55 Z"/>' },
  MI: { name: "Mumbai Indians", bg: "#0284c7", svg: '<path fill="#fff" d="M50 20 L60 40 L80 50 L60 60 L50 80 L40 60 L20 50 L40 40 Z"/>' },
  KKR: { name: "Kolkata Knight Riders", bg: "#4c1d95", svg: '<path fill="#fbbf24" d="M50 15 L75 30 L65 75 L50 85 L35 75 L25 30 Z M50 30 L60 50 L40 50 Z"/>' },
  GT: { name: "Gujarat Titans", bg: "#0f172a", svg: '<polygon fill="#facc15" points="55,15 30,50 48,50 42,85 70,45 52,45"/>' },
  RR: { name: "Rajasthan Royals", bg: "#db2777", svg: '<path fill="#fff" d="M20 35 L35 50 L50 25 L65 50 L80 35 L75 70 L25 70 Z M30 75 L70 75 L70 82 L30 82 Z"/>' },
  SRH: { name: "Sunrisers Hyderabad", bg: "#ea580c", svg: '<path fill="#fff" d="M20 50 C20 30 80 30 80 50 C70 40 60 65 50 65 C40 65 30 40 20 50 Z M50 20 L55 30 L45 30 Z"/>' },
  LSG: { name: "Lucknow Super Giants", bg: "#7f1d1d", svg: '<path fill="#fff" d="M50 15 L80 35 L65 70 L50 60 L35 70 L20 35 Z M40 40 L60 40 L50 55 Z"/>' },
  DC: { name: "Delhi Capitals", bg: "#1e3a8a", svg: '<path fill="#fff" d="M30 40 L50 20 L70 40 L70 75 L30 75 Z M40 50 L60 50 L60 75 L40 75 Z"/>' },
  PBKS: { name: "Punjab Kings", bg: "#dc2626", svg: '<path fill="#fff" d="M30 20 L70 20 L70 60 L50 80 L30 60 Z M42 35 L58 35 L58 50 L42 50 Z"/>' }
};

const venuesData = {
  CSK: "M. A. Chidambaram Stadium, Chennai",
  RCB: "M. Chinnaswamy Stadium, Bengaluru",
  MI: "Wankhede Stadium, Mumbai",
  KKR: "Eden Gardens, Kolkata",
  GT: "Narendra Modi Stadium, Ahmedabad",
  RR: "Sawai Mansingh Stadium, Jaipur",
  SRH: "Rajiv Gandhi Intl Stadium, Hyderabad",
  LSG: "BRSABV Ekana Stadium, Lucknow",
  DC: "Arun Jaitley Stadium, Delhi",
  PBKS: "HPCA Stadium, Dharamshala"
};

function getLogoSVG(code) {
  const data = teamsData[code];
  return `<div class="team-logo-box" style="background-color: ${data.bg};">
    <svg viewBox="0 0 100 100">${data.svg}</svg>
  </div>`;
}

// Generate raw matches pool
let matchPool = [];

// 1. CSK vs RCB - 14 Matches
for (let i = 0; i < 7; i++) {
  matchPool.push({ team1: "CSK", team2: "RCB", venue: venuesData.CSK });
  matchPool.push({ team1: "RCB", team2: "CSK", venue: venuesData.RCB });
}

// 2. Remaining 8 teams - 2 matches each
const otherTeams = ["MI", "KKR", "GT", "RR", "SRH", "LSG", "DC", "PBKS"];
for (let i = 0; i < otherTeams.length; i++) {
  for (let j = i + 1; j < otherTeams.length; j++) {
    const t1 = otherTeams[i];
    const t2 = otherTeams[j];
    matchPool.push({ team1: t1, team2: t2, venue: venuesData[t1] });
    matchPool.push({ team1: t2, team2: t1, venue: venuesData[t2] });
  }
}

// Fixed Matches setup
const match1Idx = matchPool.findIndex(m => m.team1 === "GT" && m.team2 === "RR");
const match1 = matchPool.splice(match1Idx, 1)[0];

const match5Idx = matchPool.findIndex(m => m.team1 === "CSK" && m.team2 === "RCB");
const match5 = matchPool.splice(match5Idx, 1)[0];

const finalSchedule = new Array(70);
finalSchedule[0] = match1;
finalSchedule[4] = match5;

let lastTeams = new Set([match1.team1, match1.team2]);

for (let slot = 1; slot < 70; slot++) {
  if (slot === 4) {
    lastTeams = new Set([match5.team1, match5.team2]);
    continue;
  }

  let foundIndex = -1;
  for (let i = 0; i < matchPool.length; i++) {
    const candidate = matchPool[i];
    if (!lastTeams.has(candidate.team1) && !lastTeams.has(candidate.team2)) {
      foundIndex = i;
      break;
    }
  }

  if (foundIndex === -1) foundIndex = 0;

  const selectedMatch = matchPool.splice(foundIndex, 1)[0];
  finalSchedule[slot] = selectedMatch;
  lastTeams = new Set([selectedMatch.team1, selectedMatch.team2]);
}

// Render Matches
const container = document.getElementById("schedule-container");

finalSchedule.forEach((match, index) => {
  const card = document.createElement("div");
  card.className = "card";
  
  const dateStr = "Date: TBD";
  const timeStr = index % 2 === 0 ? "3:30 pm IST" : "7:30 pm IST";

  card.innerHTML = `
    <div class="card-inner">
      <div class="card-header">
        <span>${dateStr}</span>
        <div class="match-time">
          <div class="time-dot"></div>
          <span>${timeStr}</span>
        </div>
      </div>
      <div class="banner">
        <div class="match-number-badge">Match ${index + 1}</div>
        <div class="teams-container">
          <div class="team">
            ${getLogoSVG(match.team1)}
            <div class="team-name">${teamsData[match.team1].name}</div>
          </div>
          <div class="vs-badge">VS</div>
          <div class="team">
            ${getLogoSVG(match.team2)}
            <div class="team-name">${teamsData[match.team2].name}</div>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <div class="venue">${match.venue}</div>
        <button class="btn">Match Preview &gt;</button>
      </div>
    </div>
  `;
  container.appendChild(card);
});
</script>

</body>
</html>
